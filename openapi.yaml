openapi: 3.0.3
info:
  title: Электронная очередь без драки
  version: 1.1.0
  description: |
    Учебный API одной очереди с несколькими операторами. Авторизация не требуется.
    Талон проходит состояния waiting → serving → completed либо skipped.
    Один оператор одновременно обслуживает максимум один талон.
    Новые операторы активны; отключённые не получают новые талоны. Оператора
    с serving-талоном отключить нельзя. Логическое отключение сохраняет историю.

    Выдача выполняется в транзакции PostgreSQL: блокировка оператора, проверка
    активности и занятости, выбор первого доступного waiting по id с FOR UPDATE SKIP LOCKED,
    назначение и COMMIT. Ответ об успешной выдаче отправляется после COMMIT.
    Порядок id соответствует выдаче номеров, но при конкурентном создании
    порядок фиксации INSERT может отличаться. Незавершённые INSERT не видны.
    Заблокированные строки пропускаются, поэтому порядок HTTP-ответов и
    фиксаций конкурентных назначений может отличаться от порядка номеров.

    204 означает отсутствие доступных для захвата талонов в момент запроса;
    подходящие строки могут быть временно заблокированы другими транзакциями.
    После их отката следующий запрос может успешно получить талон.

    Идентификаторы передаются строками: положительные десятичные int64 без
    ведущих нулей, максимум 9223372036854775807. Даты — RFC 3339 в UTC.
    После потери ответа или таймаута состояние проверяется GET-запросами:
    транзакция могла уже зафиксироваться. Изменяющие запросы не следует
    автоматически повторять без проверки результата.
servers:
  - url: /
    description: Текущий экземпляр API (по умолчанию localhost:8082)
tags:
  - name: Талоны
  - name: Операторы
paths:
  /tickets:
    post:
      tags: [Талоны]
      summary: Получить новый талон
      operationId: createTicket
      description: |
        Создаёт waiting-талон с уникальным номером A001, A002 и далее.
        Номер не сбрасывается ежедневно; после отката INSERT возможны пропуски.
        Тело запроса отсутствует; любое непустое тело отклоняется.
      responses:
        '201':
          description: Талон создан
          headers:
            Location:
              description: Путь к созданному талону
              schema:
                type: string
                example: /tickets/17
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
              example:
                id: '17'
                number: A017
                status: waiting
                operatorId: null
                createdAt: '2026-10-17T10:14:32Z'
                startedAt: null
                finishedAt: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/TooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
    get:
      tags: [Талоны]
      summary: Посмотреть очередь и историю
      operationId: listTickets
      description: |
        Возвращает талоны по возрастанию id. Без status включает все состояния.
        Пустой результат представлен массивом items: []. Каждый параметр
        задаётся максимум один раз. Пагинация отражает текущее состояние БД:
        несколько запросов страниц не образуют общий снимок.
      parameters:
        - name: status
          in: query
          description: Фильтр по состоянию; пустое значение недопустимо
          schema:
            $ref: '#/components/schemas/TicketStatus'
        - name: limit
          in: query
          description: Максимальное число талонов на странице
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          description: Число пропускаемых строк (целое десятичное число)
          schema:
            type: integer
            format: int64
            minimum: 0
            maximum: 9223372036854775807
            default: 0
      responses:
        '200':
          description: Страница списка талонов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /tickets/{id}:
    parameters:
      - $ref: '#/components/parameters/TicketID'
    get:
      tags: [Талоны]
      summary: Посмотреть талон и историю его обслуживания
      operationId: getTicket
      responses:
        '200':
          $ref: '#/components/responses/Ticket'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: ticket_not_found — талон отсутствует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /operators:
    post:
      tags: [Операторы]
      summary: Создать активного оператора
      operationId: createOperator
      description: |
        Создаёт оператора с active=true и currentTicketId=null. Крайние пробелы
        имени удаляются; имя не должно быть пустым. Повторный POST создаёт
        отдельного оператора. Операторы с одинаковыми именами допустимы.
      requestBody:
        required: true
        description: JSON-объект без дополнительных полей и данных после объекта; максимум 4096 байт
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  description: Непустое имя после удаления крайних пробелов
            example:
              name: Оператор 4
      responses:
        '201':
          description: Активный оператор создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operator'
              example:
                id: '4'
                name: Оператор 4
                active: true
                currentTicketId: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
    get:
      tags: [Операторы]
      summary: Посмотреть операторов и их активные талоны
      operationId: listOperators
      description: |
        Операторы упорядочены по id. currentTicketId равен null, когда оператор
        свободен. После потери ответа next этот маршрут позволяет проверить,
        успел ли оператор получить талон. Без active возвращает всех операторов,
        включая отключённых. Количество доступных операторов определяется
        списком с active=true, а не общим числом записей.
      parameters:
        - name: active
          in: query
          description: |
            Фильтр активности. Допустимы только true и false в нижнем регистре;
            пустое значение и повторение параметра отклоняются с 400.
          schema:
            type: boolean
      responses:
        '200':
          description: Список операторов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorList'
              example:
                items:
                  - id: '1'
                    name: Оператор 1
                    active: true
                    currentTicketId: '17'
                  - id: '2'
                    name: Оператор 2
                    active: false
                    currentTicketId: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /operators/{id}/active:
    parameters:
      - $ref: '#/components/parameters/OperatorID'
    patch:
      tags: [Операторы]
      summary: Включить или отключить оператора
      operationId: setOperatorActive
      description: |
        Устанавливает active; запись оператора и история талонов сохраняются.
        Повторная установка текущего значения допустима и не меняет данные.
        Нельзя отключить оператора с serving-талоном: возвращается 409 operator_busy.
        Проверка и изменение выполняются в транзакции под блокировкой строки
        оператора, согласованной с next. При гонке успешно либо отключение,
        либо выдача талона; второй запрос получает соответствующий конфликт.
      requestBody:
        required: true
        description: |
          JSON-объект с обязательным логическим active, без дополнительных
          полей и данных после объекта. null недопустим. Максимум 4096 байт.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [active]
              properties:
                active:
                  type: boolean
            example:
              active: false
      responses:
        '200':
          description: Текущее представление оператора с установленной активностью
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operator'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: operator_not_found — оператор отсутствует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: operator_busy — оператора с обслуживаемым талоном нельзя отключить
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /operators/{id}/next:
    parameters:
      - $ref: '#/components/parameters/OperatorID'
    post:
      tags: [Операторы]
      summary: Вызвать следующего посетителя
      operationId: nextTicket
      description: |
        Тело запроса отсутствует. Операция атомарно закрепляет первый доступный
        waiting-талон за оператором и переводит его в serving. Строка оператора
        блокируется до проверки активности и занятости, поэтому конкурентные запросы одного
        оператора также не смогут назначить ему два талона. Дополнительную
        гарантию обеспечивает частичный уникальный индекс PostgreSQL.
        Занятость проверяется прежде, чем наличие ожидающих талонов: занятой
        оператор получает 409 даже при пустой очереди.
        Неактивный оператор получает 409 operator_inactive, включая пустую очередь.
        Изменение активности использует ту же блокировку строки оператора.
      responses:
        '200':
          $ref: '#/components/responses/Ticket'
        '204':
          description: |
            Нет доступных незаблокированных waiting-талонов. Тела ответа нет.
            При SKIP LOCKED это также возможно, пока другие транзакции временно
            удерживают все подходящие строки; после их отката можно повторить вызов.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: operator_not_found — оператор отсутствует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            operator_busy — оператор уже обслуживает талон.
            operator_inactive — оператор отключён и не может получать новые талоны.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: operator_busy
                  message: Оператор уже обслуживает талон
                  details:
                    currentTicketId: '17'
        '413':
          $ref: '#/components/responses/TooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /operators/{id}/complete:
    parameters:
      - $ref: '#/components/parameters/OperatorID'
    post:
      tags: [Операторы]
      summary: Завершить обслуживание указанного талона
      operationId: completeTicket
      description: |
        Разрешён только переход serving → completed для талона данного оператора.
        Сохраняет оператора и startedAt, записывает finishedAt. ticketId обязателен:
        запоздавший повтор завершения старого талона не завершит новый талон.
        Повторное завершение возвращает 409 invalid_ticket_state.
      requestBody:
        $ref: '#/components/requestBodies/FinishTicket'
      responses:
        '200':
          $ref: '#/components/responses/Ticket'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/FinishConflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /operators/{id}/skip:
    parameters:
      - $ref: '#/components/parameters/OperatorID'
    post:
      tags: [Операторы]
      summary: Отметить вызванного посетителя как пропущенного
      operationId: skipTicket
      description: |
        Разрешён только переход serving → skipped для талона данного оператора.
        Сохраняет оператора и startedAt, записывает finishedAt. Пропущенный талон
        автоматически в очередь не возвращается. Повторный пропуск — конфликт.
      requestBody:
        $ref: '#/components/requestBodies/FinishTicket'
      responses:
        '200':
          $ref: '#/components/responses/Ticket'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/FinishConflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  parameters:
    TicketID:
      name: id
      in: path
      required: true
      description: Идентификатор талона
      schema:
        $ref: '#/components/schemas/ID'
    OperatorID:
      name: id
      in: path
      required: true
      description: Идентификатор оператора
      schema:
        $ref: '#/components/schemas/ID'
  requestBodies:
    FinishTicket:
      required: true
      description: |
        JSON-объект с обязательным строковым ticketId, без дополнительных полей
        и данных после объекта. Максимальный размер тела — 4096 байт.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [ticketId]
            properties:
              ticketId:
                $ref: '#/components/schemas/ID'
          example:
            ticketId: '17'
  schemas:
    ID:
      type: string
      pattern: '^[1-9][0-9]{0,18}$'
      maxLength: 19
      description: Положительный int64 строкой; максимум 9223372036854775807
      example: '17'
    TicketStatus:
      type: string
      enum: [waiting, serving, completed, skipped]
    Ticket:
      type: object
      required: [id, number, status, operatorId, createdAt, startedAt, finishedAt]
      properties:
        id:
          $ref: '#/components/schemas/ID'
        number:
          type: string
          pattern: '^A[0-9]{3,}$'
          description: Уникальный номер из id с минимальной шириной 3 цифры
          example: A017
        status:
          $ref: '#/components/schemas/TicketStatus'
        operatorId:
          type: string
          nullable: true
          pattern: '^[1-9][0-9]{0,18}$'
          description: null у waiting; оператор сохраняется после завершения и пропуска
          example: '2'
        createdAt:
          type: string
          format: date-time
          example: '2026-10-17T10:14:32Z'
        startedAt:
          type: string
          format: date-time
          nullable: true
          description: Начало обслуживания; null у waiting
          example: '2026-10-17T10:18:04Z'
        finishedAt:
          type: string
          format: date-time
          nullable: true
          description: Окончание обслуживания или пропуск; null у waiting и serving
          example: '2026-10-17T10:22:51Z'
    TicketList:
      type: object
      required: [items, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Ticket'
        limit:
          type: integer
          minimum: 1
          maximum: 200
          example: 50
        offset:
          type: integer
          format: int64
          minimum: 0
          example: 0
    Operator:
      type: object
      required: [id, name, active, currentTicketId]
      properties:
        id:
          $ref: '#/components/schemas/ID'
        name:
          type: string
          example: Оператор 2
        active:
          type: boolean
          default: true
          description: Разрешено ли оператору получать новые талоны
        currentTicketId:
          type: string
          nullable: true
          pattern: '^[1-9][0-9]{0,18}$'
          description: Идентификатор обслуживаемого талона, либо null
          example: '17'
    OperatorList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Operator'
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Стабильный код ошибки для клиента
              enum:
                - invalid_request
                - ticket_not_found
                - operator_not_found
                - operator_busy
                - operator_inactive
                - invalid_ticket_state
                - ticket_not_owned
                - request_too_large
                - unsupported_media_type
                - operation_timeout
                - database_unavailable
                - internal_error
                - route_not_found
                - method_not_allowed
            message:
              type: string
              description: Объяснение ошибки на русском языке
            details:
              type: object
              description: Дополнительные сведения, если доступны
              properties:
                currentTicketId:
                  $ref: '#/components/schemas/ID'
  responses:
    Ticket:
      description: Текущее представление талона
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Ticket'
    BadRequest:
      description: invalid_request — некорректные параметры, JSON или непредусмотренное тело запроса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: operator_not_found либо ticket_not_found — указанная запись отсутствует
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    FinishConflict:
      description: |
        invalid_ticket_state — талон не в состоянии serving (включая повторный вызов).
        ticket_not_owned — обслуживается другим оператором.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooLarge:
      description: request_too_large — тело запроса больше 4096 байт
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaType:
      description: unsupported_media_type — ожидается application/json
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: internal_error — внутренняя ошибка; подробности доступны только в логах
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: |
        database_unavailable — PostgreSQL временно недоступен.
        operation_timeout — превышен срок операции, ожидания блокировки или запрос отменён.
        При потере ответа во время COMMIT результат нужно проверить через GET:
        операция могла успеть зафиксироваться.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
